controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: position_controllers/GripperActionController

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joint: finger_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0